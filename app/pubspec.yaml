name: bitsign
description: BitSign phone app. Brilliant glasses tap-to-translate, backed by the published UMI SN78 model, plus a SignRush tab.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  simple_brilliant_app: ^9.1.1
  brilliant_msg: ^4.0.0
  logging: ^1.2.0
  http: ^1.2.2
  flutter_tts: ^4.2.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - packages/brilliant_msg/lua/battery.min.lua
    - packages/brilliant_msg/lua/data.min.lua
    - packages/brilliant_msg/lua/code.min.lua
    - packages/brilliant_msg/lua/plain_text.min.lua
    - packages/brilliant_msg/lua/camera.min.lua
    - assets/frame_app.lua
